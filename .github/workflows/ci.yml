name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: true}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Verify source
        run: |
          npm run lint --prefix web
          npm run build --prefix web
          go vet ./...
          go test ./...

      - name: Verify Linux builds
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/anpanel-linux-amd64 ./cmd/anpanel
          GOOS=linux GOARCH=arm64 go build -o /tmp/anpanel-linux-arm64 ./cmd/anpanel

      - name: Verify installer
        run: |
          bash -n scripts/install.sh scripts/lib/sources.sh scripts/build-installer.sh scripts/test-installer.sh
          ANPANEL_INSTALLER_VERSION=build-ci bash scripts/build-installer.sh /tmp/install.sh
          bash -n /tmp/install.sh
          shellcheck -S warning /tmp/install.sh scripts/build-installer.sh scripts/test-installer.sh
          grep -F 'TARGET_VERSION=${ANPANEL_VERSION:-build-ci}' /tmp/install.sh
          if grep -q '^VERSION=${ANPANEL_VERSION' /tmp/install.sh; then
            echo 'Release version still collides with /etc/os-release VERSION.' >&2
            exit 1
          fi
          grep -F 'curl -qfL --show-error' /tmp/install.sh
          bash scripts/test-installer.sh /tmp/install.sh
          source scripts/lib/sources.sh
          PKG_FAMILY=apt
          OS_ID=debian
          OS_VERSION=13
          REGION=global
          if sources_need_change; then
            echo 'A supported global Debian release unexpectedly requests a source change.' >&2
            exit 1
          fi
